name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q MyLauncher.zip
      - run: sed -i 's/glass(2, 0x99FFFFFF)/glass(2, 0x99FFFFFF.toInt())/' MyLauncher/app/src/main/java/com/example/mylauncher/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: MyLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-apk
          path: MyLauncher/app/build/outputs/apk/debug/app-debug.apk
